version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
      - JWT_SECRET=sovereign-amm-super-secret-key-for-hackathon
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - PUBLIC_DEMO=true
    depends_on:
      - chromadb
      - redis_cache
    volumes:
      - ./backend/app/db:/app/backend/app/db
    networks:
      - sovereign_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_GRID_ID=demo
      - NEXT_PUBLIC_AUTO_DEMO=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - sovereign_net

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_db:/chroma/chroma
    networks:
      - sovereign_net

  redis_cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sovereign_net

networks:
  sovereign_net:
    driver: bridge
